<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План знакомства · V24</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p>Друг из приюта · Вариант 24</p>
    </header>

    <main class="page">
        <nav aria-label="Основное меню">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
        </nav>

        <h1>План знакомства</h1>
        <p>Учебная форма. Данные пока не сохраняются.</p>

        <form method="get">
            <p>
                <label for="duration">Длительность встречи</label>
                <input type="range" id="duration" name="duration" min="1" max="5" value="4">
                <span class="range-labels">1 — Короткая; 5 — Долгая</span>
            </p>

            <p>
                <label for="wishes">Пожелания к встрече</label>
                <textarea id="wishes" name="wishes" rows="3"></textarea>
            </p>

            <p>
                <label for="item">Кличка животного</label>
                <select id="item" name="item" required>
                    <option value="">Выберите из списка</option>
                    <option value="item1">Луна</option>
                    <option value="item2">Барсик</option>
                    <option value="item3">Рыжик</option>
                </select>
            </p>

            <p>
                <label for="quantity">Количество посетителей</label>
                <input type="number" id="quantity" name="quantity" min="1" step="1" value="4" required>
            </p>

            <fieldset>
                <legend>Дополнительные опции</legend>
                <p>
                    <input type="checkbox" id="toy" name="toy" checked>
                    <label for="toy">Принести игрушку</label>
                </p>
                <p>
                    <input type="checkbox" id="walk" name="walk">
                    <label for="walk">Прогулка с волонтёром</label>
                </p>
            </fieldset>

            <button type="submit">Выбрать встречу</button>
            <p id="result" role="status" aria-live="polite"></p>
        </form>

        <p><a class="btn" href="index.html">Назад</a></p>
    </main>

    <script src="form.js" defer></script>
</body>
</html>
