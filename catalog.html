<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши друзья · V24</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#754383">
</head>
<body>
    <header>
        <p>Друг из приюта · Вариант 24</p>
    </header>

    <main class="page">
        <nav aria-label="Основная навигация">
            <a href="index.html">Главная</a>
            <a href="form.html">Форма</a>
        </nav>

        <h1>Наши друзья</h1>
        <p>Выберите одну из трёх позиций</p>

        <p>
            <label for="search">Поиск по названию</label>
            <input id="search" type="search" placeholder="Введите часть названия">
        </p>

        <div id="catalog-list" class="products"></div>
        <p id="status" role="status"></p>

    </main>

    <script src="catalog-page.js" defer></script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Не удалось зарегистрировать service worker:", error);
        });
      }
    </script>


</body>
</html>
